<!DOCTYPE html>
<html lang="en" class="theme-yellowblue-normal">
  <head>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta charset="utf-8" />
    <title>Number Listening Trainer</title>
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/icon_NLT_16x16.png" />

    <script src="src/js/theme-boot.js"></script>

    <link rel="stylesheet" href="src/css/main.css" />
  </head>
  <!-- NLT -->

  <body>
    <!-- Line icons. Colour comes from CSS (currentColor). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="6.5" r="1.6" fill="currentColor" stroke="none" />
        <path d="M12 10.5v8" />
      </symbol>
      <symbol id="i-mode-contrast" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
      </symbol>
      <symbol id="i-mode-normal" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
        />
      </symbol>
      <symbol id="i-mode-evening" viewBox="0 0 24 24">
        <path d="M8 17a4 4 0 0 1 8 0" />
        <path d="M2 17h20M7 20.5h10M12 7v2M4.9 9.9l1.4 1.4M17.7 11.3l1.4-1.4" />
      </symbol>
      <symbol id="i-mode-night" viewBox="0 0 24 24">
        <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" />
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <path
          d="M10.31 5.21L10.68 2.59L13.32 2.59L13.69 5.21L17.04 7.14L19.49 6.15L20.81 8.44L18.73 10.07L18.73 13.93L20.81 15.56L19.49 17.85L17.04 16.86L13.69 18.79L13.32 21.41L10.68 21.41L10.31 18.79L6.96 16.86L4.51 17.85L3.19 15.56L5.27 13.93L5.27 10.07L3.19 8.44L4.51 6.15L6.96 7.14Z"
        />
        <circle cx="12" cy="12" r="2.8" />
      </symbol>
    </svg>

    <div class="scroll-container" id="scroll-container">
      <div class="layout">
        <div class="titles-container" id="titlesContainer">
          <img class="title-icon" id="titleIcon" src="./assets/icons/icon_NLT_64x64.png" alt="Icon" />
          <div class="title-text" id="titleText">
            <h2>Number Listening Trainer<br /></h2>
            <h6 id="version" class="version"></h6>
          </div>
        </div>
        <h5>
          <a href="mailto:Oleksii.Pokormiakho.job@gmail.com" style="text-decoration: none; color: inherit"> Oleksii Pokormiakho </a>
        </h5>
        <div class="setting-row" id="settingRow">
          <div class="setting-buttons">
            <button class="help-app-btn" id="helpAppBtn" title="Open application description" aria-label="Open application description">
              <span class="framed-icon"><svg aria-hidden="true"><use href="#i-info" /></svg></span>
            </button>
            <button type="button" class="settings-app-btn" id="settingsAppBtn" title="Settings" aria-label="Settings">
              <span class="framed-icon"><svg aria-hidden="true"><use href="#i-gear" /></svg></span>
            </button>
          </div>
          <button type="button" class="mode-app-btn" id="themaModeBtn" title="Mode" aria-label="Mode">
            <span class="mode-icon" id="themaModeIcon"></span>
          </button>
        </div>

        <div class="section-row">
          <div class="section-block section-block-exercises">
            <div class="number-area" id="numberGrid">
              <div class="column">
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />

                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
              </div>
              <div class="column">
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
              </div>
              <div class="column">
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
              </div>
              <div class="column">
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />

                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
                <input type="text" class="number-input" readonly maxlength="2" placeholder="***" tabindex="-1" />
              </div>
            </div>
            <div class="repeat-info-group">
              <span class="repeats-text" id="labelRepeatsText">Repeat left:</span>
              <span id="repeatLeft" class="repeat-left">x</span>
            </div>
          </div>

          <div class="setting-button-wrapper">
            <div class="section-block section-block-buttons">
              <button class="fill-random-btn" id="fillRandomBtn">Rnd</button>
              <button disabled id="startPauseBtn" class="start-pause-btn">Start</button>
              <button disabled id="resetBtn" class="reset-btn">Reset</button>
            </div>
            <div class="section-block section-block-settings">
              <div class="speed-delay-wrapper">
                <div class="speed-group">
                  <label for="speedSelect" id="labelSpeed">Speed</label>
                  <select id="speedSelect" class="speed-select">
                    <option value="0.6">0.6</option>
                    <option value="0.8">0.8</option>
                    <option value="1.0" selected>1.0</option>
                    <option value="1.2">1.2</option>
                    <option value="1.4">1.4</option>
                    <option value="1.6">1.6</option>
                    <option value="1.8">1.8</option>
                    <option value="2.0">2.0</option>
                  </select>
                </div>
                <div class="interval-group">
                  <label for="intervalSelect" id="labelInterval" class="label-interval">Interval</label>
                  <select id="intervalSelect" class="interval-select">
                    <option value="500">500</option>
                    <option value="1000" selected>1000</option>
                    <option value="1500">1500</option>
                    <option value="2000">2000</option>
                    <option value="2500">2500</option>
                    <option value="3000">3000</option>
                    <option value="4000">4000</option>
                    <option value="5000">5000</option>
                  </select>
                </div>
              </div>
              <div class="digit-length-count-repeat-wrapper">
                <div class="digit-length-group">
                  <label for="digitLengthSelect" id="labelDigitLength" class="label-digit-length"> Digit length</label>
                  <select id="digitLengthSelect" class="digit-length-select">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                  </select>
                </div>
                <div class="count-group">
                  <label for="countSelect" id="labelCount">Count</label>
                  <select id="countSelect" class="count-select">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20" selected>20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                  </select>
                </div>
                <div class="repeat-group">
                  <label for="repeatSelect" id="labelRepeat" class="label-repeat">Repeat</label>
                  <select id="repeatSelect" class="repeat-select">
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                  </select>
                </div>
              </div>
              <div class="fullscreen-wrapper">
                <div class="fullscreen-switcher-group">
                  <label for="fullscreenSelect" id="labelFullscreen" class="label-fullscreen">Fullscreen</label>
                  <select id="fullscreenSelect" class="fullscreen-select">
                    <option value="0">No</option>
                    <option value="1" selected>Yes</option>
                  </select>
                </div>
                <div class="fullscreen-delay-mode-group">
                  <label for="fullscreenDelayMode" id="labelFullscreenDelayMode" class="label-fullscreen-delay-mode">Delay mode:</label>
                  <select id="fullscreenDelayMode" class="fullscreen-delay-mode">
                    <option value="No delay" selected>No</option>
                    <option value="Visual delay">Visual</option>
                    <option value="Audio delay">Audio</option>
                  </select>
                </div>
                <div class="fullscreen-delay-group">
                  <label for="fullscreenDelay" id="labelFullscreenDelay" class="label-fullscreen-delay">Delay (sec):</label>
                  <select id="fullscreenDelay" class="fullscreen-delay">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                  </select>
                </div>
              </div>
              <div class="language-voice-wrapper">
                <div class="language-group">
                  <label for="languageCodeSelect" id="labelLanguageCode" class="label-language-code">Language</label>
                  <select id="languageCodeSelect" title="Language" class="language-code-select"></select>
                </div>
                <div class="voice-group">
                  <label for="voiceSelect" id="labelVoice" class="label-voice">Voice</label>
                  <select id="voiceSelect" title="Voice" class="voice-select"></select>
                </div>
              </div>
              <div class="thema-wrapper">
                <div class="thema-group" id="themaGroup">
                  <label for="themaSelect" id="labelThema" class="label-thema">Thema</label>
                  <select id="themaSelect" class="thema-select"></select>
                </div>
                <div class="thema-group" id="themaModeGroup">
                  <label for="themaModeSelect" id="labelThemaMode" class="label-thema">Mode</label>
                  <select id="themaModeSelect" class="thema-select" title="Select theme mode">
                    <option value="contrast">Contrast</option>
                    <option value="normal" selected>Normal</option>
                    <option value="evening">Evening</option>
                    <option value="night">Night</option>
                  </select>
                </div>
              </div>

              <div class="interface-wrapper">
                <div class="interface-group" id="uiLanguageWrapper">
                  <label for="uiLangSelect" id="uiLangLabel" class="label-interface">Interface</label>
                  <select id="uiLangSelect" class="interface-select" title="Select interface language">
                    <option value="ar">العربية</option>
                    <option value="cs">Čeština</option>
                    <option value="de">Deutsch</option>
                    <option selected value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="it">Italiano</option>
                    <option value="nl">Nederlands</option>
                    <option value="pl">Polski</option>
                    <option value="pt">Português</option>
                    <option value="ru">Русский</option>
                    <option value="tr">Türkçe</option>
                    <option value="uk">Українська</option>
                  </select>
                </div>
              </div>

              <div class="reset-settings-group" id="resetSettingsGroup">
                <button class="reset-settings-btn" id="resetSettingsBtn" title="Reset to default settings">
                  <span class="reset-icon">🔄</span>
                </button>
                <span class="reset-settings-text" id="resetSettingsText">Reset defaults</span>
              </div>
            </div>
          </div>

          <div class="background-overlay" id="backgroundOverlay"></div>
          <div class="active-number-overlay" id="activeNumberOverlay"></div>
        </div>

        <div class="developer" id="developer">
          <button type="button" id="developerPathBtn" title="Path to this page">Path</button>
          <button type="button" id="developerClearBtn" title="Clear the saved settings of this app">Clear LS</button>
        </div>
      </div>

      <div class="scroll-bottom-space"></div>
    </div>

    <div id="settingsAppModal" class="app-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="app-modal-content">
        <div class="app-modal-header">
          <h2 class="app-modal-title" id="settingsTitle">Application settings</h2>
          <button type="button" id="settingsAppCloseBtn" class="app-modal-close-btn" title="Close" aria-label="Close">✕</button>
        </div>
        <div class="app-modal-body-wrap">
          <div class="app-modal-body" id="settingsBody"></div>
        </div>
      </div>
    </div>

    <div id="helpAppModal" class="help-app-modal hidden">
      <div class="help-app-modal-content">
        <button id="helpAppCloseBtn" class="help-app-close-btn">✕</button>
        <div id="helpAppContent"></div>
      </div>
    </div>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
